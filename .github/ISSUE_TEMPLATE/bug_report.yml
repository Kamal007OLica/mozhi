name: Bug report / பிழை
description: Something in Mozhi doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Slack and click the message box
        2. Double-tap Control and say "..."
        3. Press Enter
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows 11, Windows 10]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mozhi version
      description: Mozhi → About.
      placeholder: "0.1.0"
  - type: input
    id: app
    attributes:
      label: App you were typing into
      placeholder: Slack, WhatsApp Desktop, Chrome, Word…
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "macOS: ~/Library/Logs/app.mozhi.desktop/ · Windows: %LOCALAPPDATA%\\app.mozhi.desktop\\logs\\"
      render: text
